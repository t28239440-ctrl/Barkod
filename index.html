<html lang="tr"><head><meta charset="utf-8">

<style>

</style></head><body>
<div class="row" style="align-items:center;justify-content:space-between;margin:0 0 10px"><h1 style="margin:0">Barkod Okuyucu</h1><span class="row" style="margin:0;flex-wrap:nowrap"><button class="sec" id="zo">−</button><button class="sec" id="zr">100%</button><button class="sec" id="zi">+</button></span></div>

<script>
const $=id=>document.getElementById(id),esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const say=(t,w)=>{$("msg").textContent=t;$("msg").style.color=w?"#c0392b":""};
let dev=Object.assign({url:"",key:"",dev:""},LS("dev")),app=LS("app6")||{tabs:[]},T="K";
const save=()=>{LS("app6",app);mark()};
/* ----- yedek / dışa aktarma ----- */
const today=()=>new Date().toISOString().slice(0,10);
function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function bkAge(){const t=LS("lbk"),n=(app.rec||[]).length;if(!t)return n?'<div class="msg warn">Henüz tam yedek alınmadı.</div>':"";const d=Math.floor((Date.now()-t)/864e5);return '<div class="msg'+(d>7&&n?' warn':'')+'">Son tam yedek: '+(d?d+" gün önce":"bugün")+'</div>'}
function bkCard(){return `<div class="card"><b>Yedek ve dışa aktarma</b><div class="msg">Tarayıcı verisi silinirse ayarlar ve kayıtlar gider; düzenli yedek al.</div>${bkAge()}<div class="row"><button class="sec" data-pc="bk-cfg">Ayarları indir</button><button class="sec" data-pc="bk-all">Ayar + kayıt yedeği</button></div><div class="row"><button class="sec" data-pc="csv">Kayıtları CSV indir</button></div><label class="lb">Yedekten yükle (.json)</label><input type="file" accept=".json,application/json" data-bk="file" style="width:100%"></div>`}
function csvCell(v){v=String(v==null?"":v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
function recCsv(r){
  const rows=[["Tarih","Sekme","Barkod","Statü","Seçimler"].map(csvCell).join(";")];
  r.forEach(x=>rows.push([csvCell(new Date(x.t).toLocaleString("tr-TR")),csvCell(x.sekme),(x.kod?'="'+String(x.kod).replace(/\D/g,"")+'"':csvCell("Barkodsuz")),csvCell(x.statu),csvCell((x.sec||[]).map(o=>o.n+(o.v?": "+o.v:"")).join(" | "))].join(";")));
  return "\ufeff"+rows.join("\r\n");
}
function recWide(r,ok){
  ok=ok||(()=>true);const names=app.tabs.map(t=>t.n).filter(ok);r.forEach(x=>{if(!names.includes(x.sekme))names.push(x.sekme)});
  const G={},fmt=x=>new Date(x.t).toLocaleString("tr-TR"),DG=864e5,num=v=>String(Math.round(v*10)/10).replace(".",",");
  const gn=o=>o.g||"Seçimler",cell=(x,g)=>(x.sec||[]).filter(o=>gn(o)===g).map(o=>o.n===g&&o.v?o.v:o.n+(o.v?": "+o.v:"")).join(" | ");
  const cols={};names.forEach(n=>cols[n]=[]);
  r.slice().sort((a,b)=>a.t<b.t?-1:1).forEach(x=>{const kk=x.kod||"~"+(x.id||x.t);(G[kk]||(G[kk]={}))[x.sekme]=x;(x.sec||[]).forEach(o=>{const a=cols[x.sekme],g=gn(o);if(!a.includes(g))a.push(g)})});
  const fb=app.tabs.map(t=>t.n).filter(ok),fin=fb.length?fb[fb.length-1]:null;
  const head=["Barkod","Bulunduğu Yer","Son İşlem Tarihi","Toplam Süre (gün)","Bulunduğu Yerde Bekleme (gün)"];
  names.forEach(n=>{head.push(n+" Tarih",n+" Statü");cols[n].forEach(g=>head.push(n+" · "+g))});
  const rows=[head.map(csvCell).join(";")];
  Object.keys(G).sort().forEach(k=>{const g=G[k],all=Object.values(g).sort((a,b)=>a.t<b.t?-1:1),first=all[0],last=all[all.length-1];
    const row=[(k[0]==="~"?csvCell("Barkodsuz"):'="'+String(k).replace(/\D/g,"")+'"'),csvCell(last.sekme),csvCell(fmt(last)),csvCell(num((new Date(last.t)-new Date(first.t))/DG)),csvCell(last.sekme===fin?"":num((Date.now()-new Date(last.t))/DG))];
    names.forEach(n=>{const x=g[n];row.push(csvCell(x?fmt(x):""),csvCell(x?x.statu||"":""));cols[n].forEach(h=>row.push(csvCell(x?cell(x,h):"")))});
    rows.push(row.join(";"))});
  return "﻿"+rows.join("\r\n");
}
function csvOut(f,l){
  const r=(app.rec||[]).filter(x=>!f||(recTabOk(x.sekme)&&(!recQ||String(x.kod).includes(recQ)))).sort((a,b)=>a.t<b.t?-1:1);
  if(!r.length){say("İndirilecek kayıt yok.",1);return}
  dl("kayitlar-"+(l?"satir-":"")+today()+".csv",l?recCsv(r):recWide(r,f?recTabOk:null),"text/csv;charset=utf-8");
  say((l?"":new Set(r.filter(x=>x.kod).map(x=>x.kod)).size+" barkod, ")+r.length+" kayıt indirildi"+(f&&recQ?" (filtreli).":"."));
}
async function mailOut(){
  const r=(app.rec||[]).filter(x=>recTabOk(x.sekme)&&(!recQ||String(x.kod).includes(recQ))).sort((a,b)=>a.t<b.t?-1:1);
  if(!r.length){say("Gönderilecek kayıt yok.",1);return}
  const name="kayitlar-"+today()+".csv";
  try{const f=new File([recWide(r,recTabOk)],name,{type:"text/csv"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Barkod kayıtları",text:r.length+" kayıt ektedir."});say("Paylaşım açıldı, mail uygulamasını seç.");return}
  }catch(e){if(e&&e.name==="AbortError")return}
  const body=r.map(x=>[new Date(x.t).toLocaleString("tr-TR"),x.sekme,x.kod||"Barkodsuz",x.statu||"",(x.sec||[]).map(o=>o.n+(o.v?": "+o.v:"")).join(" | ")].join(" ; ")).join("\n");
  const cut=body.length>1500;
  location.href="mailto:?subject="+encodeURIComponent("Barkod kayıtları "+today())+"&body="+encodeURIComponent(cut?body.slice(0,1500)+"\n… (kısaltıldı, tamamı için CSV indir)":body);
  say(cut?"Mail açıldı (metin kısaltıldı). Tamamı için CSV indir.":"Mail açıldı.");
}
/* ----- senkron (Google Sheets / Apps Script) ----- */
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let sbusy=false,sagain=false,sT=null;
const sdirty=()=>!!LS("sd");
function syUi(t,w){const e=$("sy");if(e){e.textContent=t;e.style.color=w?"#c0392b":""}}
function syState(){if(!dev.url){syUi("");return}syUi(sdirty()?"☁ bekliyor":"☁ eşitlendi")}
function mark(){if(!dev.url)return;LS("sd",1);syState();clearTimeout(sT);sT=setTimeout(push,1500)}
async function push(){
  if(!dev.url)return;if(sbusy){sagain=true;return}
  sbusy=true;syUi("☁ gönderiliyor…");
  try{
    (app.rec||[]).forEach(x=>{if(!x.id)x.id=nid()});LS("app6",app);
    const body=JSON.stringify({key:dev.key,dev:dev.dev||"cihaz",tabs:app.tabs.map(t=>{const c=Object.assign({},t);delete c.pin;return JSON.parse(JSON.stringify(c,(k,v)=>k==="im"?undefined:v))}),rec:app.rec||[]});
    const r=await fetch(dev.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body});
    const j=await r.json();if(!j.ok)throw new Error(j.err||"hata");
    if(j.onay&&j.onay.length)say("Sheet'te onaylandı: "+j.onay.join(", "));
    if(!sagain)LS("sd",0);
    syState();
  }catch(e){syUi("☁ gönderilemedi: "+(e&&e.message||"bağlantı")+" — tekrar denenecek",1)}
  sbusy=false;if(sagain){sagain=false;push()}
}
async function pull(){
  if(!dev.url){say("Önce senkron adresini gir.",1);return}
  say("Sunucudan okunuyor…");
  try{
    const r=await fetch(dev.url+(dev.url.includes("?")?"&":"?")+"key="+encodeURIComponent(dev.key)+"&dev="+encodeURIComponent(dev.dev||"cihaz"));
    const j=await r.json();if(!j.ok)throw new Error(j.err||"hata");
    const add=(j.rec||[]).filter(x=>x&&x.sekme&&(x.kod?!dup(x.kod,x.sekme):!(app.rec||[]).some(y=>y.id&&y.id===x.id)));
    if(!confirm("Sunucudaki sekmeler bu cihazdakilerin yerine konacak ve "+add.length+" eksik kayıt eklenecek. Devam edilsin mi?")){say("Vazgeçildi.");return}
    const pins={};app.tabs.forEach(t=>{if(t.pin)pins[t.n]=t.pin});
    if(Array.isArray(j.tabs)&&j.tabs.length){app.tabs=j.tabs;app.tabs.forEach(t=>{if(pins[t.n])t.pin=pins[t.n]})}
    app.rec=app.rec||[];(j.rec||[]).forEach(x=>{if(x&&x.id&&x.ok){const y=app.rec.find(z=>z.id===x.id);if(y&&!y.ok)y.ok=x.ok}});add.forEach(x=>app.rec.push(x));app.rec.sort((a,b)=>a.t<b.t?-1:1);
    save();sel={};vals={};bsel={};col.clear();dinit.clear();T="K";draw();say("Sunucudan yüklendi ("+add.length+" yeni kayıt).");
  }catch(e){say("Sunucudan okunamadı: "+(e&&e.message||"bağlantı"),1)}
}
/* ----- son kaydı geri al ----- */
let lastDel=null;
function lastIdx(){const r=app.rec||[];let b=-1;r.forEach((x,i)=>{if(b<0||x.t>=r[b].t)b=i});return b}
function undoUi(){const u=$("undo");if(!u)return;
  if(lastDel){u.style.display="";u.textContent="↷ Geri getir: "+(lastDel.kod||"Barkodsuz")+" · "+lastDel.sekme;return}
  const i=lastIdx();if(i<0){u.style.display="none";return}
  u.style.display="";u.textContent="↶ Son kaydı geri al: "+(app.rec[i].kod||"Barkodsuz")+" · "+app.rec[i].sekme}
/* ----- şu an nerede ----- */
let whSel=null,waitD=Math.max(1,+(LS("wd")||3));
const whAge=x=>(Date.now()-new Date(x.t))/864e5;
const whTxt=x=>{const d=whAge(x);return d<1?"bugün":Math.floor(d)+" gün"};
const whBtn=x=>'<button class="sec" data-pc="gob" data-k="'+esc(x.kod)+'" style="min-height:36px;padding:5px 9px">'+esc(x.kod)+' <span class="msg">'+whTxt(x)+'</span></button>';
function whNow(){const L={};(app.rec||[]).forEach(x=>{if(!x.kod)return;const c=L[x.kod];if(!c||x.t>=c.t)L[x.kod]=x});return Object.values(L)}
function whList(a,cap){return '<div class="row">'+a.slice(0,cap).map(whBtn).join("")+'</div>'+(a.length>cap?'<div class="msg">… ve '+(a.length-cap)+' barkod daha (aşağıdaki aramayı kullan)</div>':"")}
function waitList(){
  const fin=app.tabs.length?app.tabs[app.tabs.length-1].n:null;
  const a=whNow().filter(x=>x.sekme!==fin&&whAge(x)>waitD).sort((p,q)=>p.t<q.t?-1:1);
  if(!a.length)return '<div class="msg">'+waitD+' günden fazla bekleyen yok.</div>';
  const G={};a.forEach(x=>(G[x.sekme]||(G[x.sekme]=[])).push(x));
  return Object.keys(G).map(k=>'<div class="lb">'+esc(k)+' ('+G[k].length+')</div>'+whList(G[k],60)).join("");
}
function whereCard(){
  const cur=whNow();if(!cur.length)return "";
  const names=app.tabs.map(t=>t.n);cur.forEach(x=>{if(!names.includes(x.sekme))names.push(x.sekme)});
  const cnt={};cur.forEach(x=>cnt[x.sekme]=(cnt[x.sekme]||0)+1);
  const lst=whSel?cur.filter(x=>x.sekme===whSel).sort((p,q)=>p.t<q.t?-1:1):null;
  return '<div class="card"><b>Şu an nerede</b> <span class="msg">'+cur.length+' barkod</span><div class="row">'+names.map(n=>'<button class="tab '+(whSel===n?"on":"")+'" data-pc="wh" data-n="'+esc(n)+'">'+esc(n)+' · '+(cnt[n]||0)+'</button>').join("")+'</div>'+(lst?'<div class="lb">'+esc(whSel)+' — en uzun bekleyen başta</div>'+whList(lst,120):"")+'<div class="row" style="align-items:center"><span class="msg" style="margin:0">Bekleyenler:</span><input data-wd="1" type="number" inputmode="numeric" min="1" value="'+waitD+'" style="width:70px;flex:none"><span class="msg" style="margin:0">günden fazla (son sekme hariç)</span></div><div id="wl">'+waitList()+'</div></div>';
}
/* ----- atlama uyarısı (sadece uyarı, engellemez) ----- */
function skipOf(c){const i=+T;if(T==="K"||T==="R"||!(i>0))return null;const pv=app.tabs[i-1];return pv&&!dup(c,pv.n)?pv.n:null}
/* ----- PIN ----- */
const sha=async v=>{try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("bk|"+v));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const c of "bk|"+v)h=((h<<5)+h+c.charCodeAt(0))>>>0;return "f"+h}};
const b2h=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const kdf=async(v,s)=>{const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(v),"PBKDF2",false,["deriveBits"]);return crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:s,iterations:150000},k,256)};
async function hp(v){try{const s=crypto.getRandomValues(new Uint8Array(16));return "p2$"+b2h(s)+"$"+b2h(await kdf(v,s))}catch(e){return sha(v)}}
async function chk(v,st){if(!st)return false;if(st.slice(0,3)!=="p2$")return await sha(v)===st;try{const p=st.split("$");return b2h(await kdf(v,new Uint8Array(p[1].match(/../g).map(h=>parseInt(h,16)))))===p[2]}catch(e){return false}}
const tUnl=new Map(),tabPin=i=>app.tabs[i]&&app.tabs[i].pin||null,tabOpen=i=>!tabPin(i)||(tUnl.get(app.tabs[i])||0)>Date.now();
const pinOn=()=>!!LS("pin");let unl=0,fails=+(LS("pf")||0),lockT=+(LS("lk")||0);const PMS=300000;

    save();sel={};vals={};bsel={};col.clear();dinit.clear();cur="";$("code").value="";draw();say("Kaydedildi.");return}
  if(!b||!b.dataset.c)return;const D=b.dataset,I=D.i,i=TI(D.i),a=app.tabs;sel={};vals={};bsel={};col.clear();dinit.clear();
  if(D.c[0]==="b"){
    openB=i;const L=a[i].b||(a[i].b=[]),x=+D.x;

  }

    if(D.c==="otg"){const z=I+"|"+D.p;fold.has(z)?fold.delete(z):fold.add(z);draw();return}
    if(D.c==="oall"){const[L,x]=parentOf(I,D.p),s0=L[x];if(L.length<2){say("Başka seçim yok.",1);return}
      if(!confirm("\""+s0.n+"\" alt seçimleri diğer "+(L.length-1)+" seçime uygulansın mı? Onların mevcut alt seçimleri DEĞİŞECEK (yan seçimleri değişmez)."))return;
      subCopy(s0,L);a[i].ref=s0.n;save();draw();say("Alt seçimler tüm seçimlere uygulandı.");return}
    if(D.c==="oadd")listAt(I,D.p,D.k).push({n:String(I)[0]==="b"?"Buton":"Seçim",c:[],y:[]});
    else{const[L,x]=parentOf(I,D.p);
      if(D.c==="odel"){if(!confirm("Seçim silinsin mi?"))return;L.splice(x,1)}
      else{const j=x+(D.c==="oup"?-1:1);if(j<0||j>=L.length)return;[L[x],L[j]]=[L[j],L[x]]}}
    save();draw();return;
  }
  if(D.c==="add")a.push({n:"Yeni sekme"});

  else{const j=i+(D.c==="up"?-1:1);if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]}

};

let stream=null,timer=null,zx=null,kbOn=false;
const beep=(f=1000)=>{try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.frequency.value=f;o.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},120)}catch(e){}};

function openEdit(idx){
  const src=app.rec[idx];if(!src)return;
  const d=JSON.parse(JSON.stringify(src));d.sec=d.sec||[];
  const o=document.createElement("div");o.className="ov";
  const bx=document.createElement("div");bx.className="bx ed";bx.setAttribute("role","dialog");bx.setAttribute("aria-modal","true");o.appendChild(bx);
  const fit=()=>{bx.style.zoom=zm;bx.style.width=Math.min(440,(innerWidth-40)/zm)+"px";bx.style.maxHeight=((innerHeight-40)/zm)+"px"};
  const rows=()=>d.sec.map((r,j)=>`<div class="row"><input data-ed="n|${j}" value="${esc(r.n)}" placeholder="Başlık / seçim"><input data-ed="v|${j}" value="${esc(r.v)}" placeholder="Yazı (varsa)"><button class="sec" data-c="rj" data-j="${j}">Sil</button></div>`).join("");
  const render=()=>{const sc=bx.querySelector(".eb"),y=sc?sc.scrollTop:0;
    bx.innerHTML=`<div class="eh"><b>✎ Kaydı düzenle · ${esc(d.sekme)}</b><span class="msg" style="margin:0">${esc(new Date(d.t).toLocaleString("tr-TR"))}</span></div><div class="eb"><label class="lb">Barkod</label><input data-ed="kod" inputmode="numeric" maxlength="9" placeholder="Barkodsuz" value="${esc(d.kod)}"><label class="lb">Statü</label><input data-ed="statu" value="${esc(d.statu)}"><label class="lb">Seçimler ve yazılar</label>${rows()}<div class="row"><button class="sec" data-c="ra">+ Satır ekle</button></div><div class="msg" id="eem"></div></div><div class="bt"><button class="sec" data-c="rc">Vazgeç</button><button data-c="rs">Kaydet</button></div>`;
    const n=bx.querySelector(".eb");if(n)n.scrollTop=y};
  const close=()=>{document.removeEventListener("keydown",kd,true);o.remove();$("code").focus({preventScroll:true})},
    kd=e=>{if(e.key==="Escape"){e.stopPropagation();close()}};
  const em=m=>{const z=bx.querySelector("#eem");if(z){z.textContent=m;z.style.color="#c0392b"}};
  bx.addEventListener("input",e=>{const t=e.target,v=t.dataset.ed;if(!v)return;
    if(v==="kod"){const x=t.value.replace(/\D/g,"");t.value=x;d.kod=x}else if(v==="statu")d.statu=t.value;
    else{const[f,j]=v.split("|");d.sec[+j][f]=t.value}});
  bx.addEventListener("click",e=>{const b=e.target.closest("button"),c=b&&b.dataset.c;if(!c)return;

    if(c==="rj"){d.sec.splice(+b.dataset.j,1);render();return}

      let k=String(d.kod||"");
      if((!k&&!d.nb)||/\D/.test(k)||k.length>9){em("Barkod hatalı: en çok 9 haneli rakam olmalı.");return}

      const x=!k?null:(app.rec||[]).find((r,i)=>i!==idx&&r.sekme===d.sekme&&r.kod===k);
      if(x){em(dupMsg(x));return}
      d.kod=k;if(k)delete d.nb;
      d.sec=d.sec.filter(r=>(r.n||"").trim()||(r.v||"").trim()).map(r=>{const q={n:(r.n||"").trim()};if((r.v||"").trim())q.v=r.v.trim();if(r.g)q.g=r.g;if(r.p)q.p=1;return q});
      d.statu=(d.statu||"").trim();

function closeKb(){if(!kbOn)return;kbOn=false;const e=$("code");e.inputMode="none";e.blur();e.focus({preventScroll:true})}
function commit(c){
  if(/\D/.test(c)){reject("Barkod hatalı: harf/geçersiz karakter içeriyor ("+c+")");return}
  if(c.length>9){reject("Barkod hatalı: 9 haneden fazla ("+c+")");return}
  const z=c.length<9;if(z)c=c.padStart(9,"0");
  if(T==="R"){recQ=c;$("code").value=c;draw();closeKb();const n=(app.rec||[]).filter(x=>String(x.kod).includes(c)).length;beep(1000);say(n?"Arama: "+c+" — "+n+" kayıt":"Arama: "+c+" — kayıt yok",!n);return}
  if(T!=="K"&&app.tabs[+T]&&app.tabs[+T].nb){reject("Bu sekme barkodsuz: barkod okutulamaz.");return}
  if(T!=="K"){const d=dup(c,app.tabs[+T].n);if(d){reject(dupMsg(d));return}}
  cur=c;$("code").value=c;ui();closeKb();const sk=skipOf(c);beep(sk?650:z?500:1000);if(navigator.vibrate)try{navigator.vibrate(sk?[120,80,120,80,120]:z?[100,60,100]:60)}catch(x){}
  say(sk?"⚠ Uyarı: \""+sk+"\" kaydı yok, aşama atlanmış olabilir. Yine de kaydedebilirsin. ("+c+")":z?"Barkod kısa, başına sıfır eklendi: "+c:"Okundu: "+c,z||!!sk);
}
function found(c){$("code").value=c;letters=false;commit(c);stop()}

}

  }catch(e){stop();say("Kamera açılamadı ("+(e&&e.name||"hata")+"). Kamera iznini kontrol et.")}
};
